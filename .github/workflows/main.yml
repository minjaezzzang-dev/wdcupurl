name: Compile app.py for Windows

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          script_name: app.py
          onefile: true
          # [선택] 터미널 창을 숨겨야 하는 GUI 프로그램(PyQt, Tkinter 등)인 경우 주석 해제하세요.
          # disable_console: true 
          # [선택] 실행 파일(.exe)에 아이콘을 넣고 싶다면 프로젝트 폴더에 icon.ico를 두고 주석을 해제하세요.
          # windows_icon_path: icon.ico

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-exe
          path: ${{ env.DESTINATION_UPLOAD_DIR }}/*
